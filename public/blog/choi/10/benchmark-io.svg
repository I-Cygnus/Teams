<svg width="100%" viewBox="0 0 720 396" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif">
<title>DB 20ms 대기 워크로드에서 세 방식의 처리량과 p99 지연</title>
<desc>동시 연결 500 기준, 플랫폼 스레드는 초당 340건에 p99 1240밀리초, 가상 스레드는 4180건에 41밀리초, WebFlux는 4520건에 37밀리초를 기록했다.</desc>

<text x="40" y="30" font-size="12" font-weight="600" fill="#52514E">처리량 (req/s) — 높을수록 좋다</text>

<text x="40" y="64" font-size="11" fill="#52514E">플랫폼 스레드</text>
<rect x="160" y="52" width="34" height="20" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="204" y="67" font-size="11" font-weight="600" fill="#A32D2D">340</text>

<text x="40" y="100" font-size="11" fill="#52514E">가상 스레드</text>
<rect x="160" y="88" width="418" height="20" rx="3" fill="#EFE9FB" stroke="#6C4EC9" stroke-width="0.5"/>
<text x="588" y="103" font-size="11" font-weight="600" fill="#5B3FB5">4,180</text>

<text x="40" y="136" font-size="11" fill="#52514E">WebFlux</text>
<rect x="160" y="124" width="452" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="622" y="139" font-size="11" font-weight="600" fill="#0F6E56">4,520</text>

<line x1="40" y1="172" x2="680" y2="172" stroke="#D9D7D2" stroke-width="1"/>

<text x="40" y="206" font-size="12" font-weight="600" fill="#52514E">p99 지연 (ms) — 낮을수록 좋다</text>

<text x="40" y="240" font-size="11" fill="#52514E">플랫폼 스레드</text>
<rect x="160" y="228" width="452" height="20" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="622" y="243" font-size="11" font-weight="600" fill="#A32D2D">1,240</text>

<text x="40" y="276" font-size="11" fill="#52514E">가상 스레드</text>
<rect x="160" y="264" width="15" height="20" rx="3" fill="#EFE9FB" stroke="#6C4EC9" stroke-width="0.5"/>
<text x="185" y="279" font-size="11" font-weight="600" fill="#5B3FB5">41</text>

<text x="40" y="312" font-size="11" fill="#52514E">WebFlux</text>
<rect x="160" y="300" width="13" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="183" y="315" font-size="11" font-weight="600" fill="#0F6E56">37</text>

<text x="40" y="356" font-size="11" fill="#898781">DB 20ms 대기 · 동시 연결 500 · JDK 21 · Spring Boot 3.4 · 8코어</text>
<text x="40" y="376" font-size="11" fill="#52514E">플랫폼 대비 약 12배 — 그리고 가상 스레드와 WebFlux는 8% 이내의 접전</text>
</svg>
