<svg width="100%" viewBox="0 0 720 340" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif">
<title>병목은 사라지지 않고 다음 약한 곳으로 옮겨간다</title>
<desc>기존에는 스레드 200개가 병목이자 안전장치였지만, 버추얼 스레드로 그 제한이 풀리면 요청 5000개가 그대로 DB 커넥션 풀 20개로 몰려 새로운 병목이 된다.</desc>

<text x="40" y="34" font-size="12" font-weight="600" fill="#52514E">기존 — 스레드가 병목이자 안전장치</text>

<rect x="40" y="50" width="96" height="46" rx="6" fill="#F4F3F0" stroke="#898781" stroke-width="0.5"/>
<text x="88" y="70" text-anchor="middle" font-size="11" fill="#52514E">요청</text>
<text x="88" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#52514E">5,000</text>

<path d="M136 73 L176 73" fill="none" stroke="#898781" stroke-width="1"/>
<path d="M176 73 l-7 -4 l0 8 z" fill="#898781"/>

<rect x="184" y="50" width="120" height="46" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="244" y="70" text-anchor="middle" font-size="11" fill="#A32D2D">스레드 풀</text>
<text x="244" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#A32D2D">200 — 여기서 막힘</text>

<path d="M304 73 L344 73" fill="none" stroke="#898781" stroke-width="1"/>
<path d="M344 73 l-7 -4 l0 8 z" fill="#898781"/>

<rect x="352" y="50" width="120" height="46" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="412" y="70" text-anchor="middle" font-size="11" fill="#0F6E56">DB 커넥션 풀</text>
<text x="412" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#0F6E56">20 — 여유</text>

<text x="500" y="78" font-size="11" fill="#52514E">앞에서 걸러지니 DB는 평온했다</text>

<line x1="40" y1="128" x2="680" y2="128" stroke="#D9D7D2" stroke-width="1"/>

<text x="40" y="164" font-size="12" font-weight="600" fill="#52514E">버추얼 스레드 — 스레드 제한이 풀린 뒤</text>

<rect x="40" y="180" width="96" height="46" rx="6" fill="#F4F3F0" stroke="#898781" stroke-width="0.5"/>
<text x="88" y="200" text-anchor="middle" font-size="11" fill="#52514E">요청</text>
<text x="88" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#52514E">5,000</text>

<path d="M136 203 L176 203" fill="none" stroke="#898781" stroke-width="1"/>
<path d="M176 203 l-7 -4 l0 8 z" fill="#898781"/>

<rect x="184" y="180" width="120" height="46" rx="6" fill="#EFE9FB" stroke="#6C4EC9" stroke-width="0.5"/>
<text x="244" y="200" text-anchor="middle" font-size="11" fill="#5B3FB5">가상 스레드</text>
<text x="244" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#5B3FB5">5,000 — 다 통과</text>

<path d="M304 203 L344 203" fill="none" stroke="#A32D2D" stroke-width="1.4"/>
<path d="M344 203 l-7 -4 l0 8 z" fill="#A32D2D"/>

<rect x="352" y="180" width="120" height="46" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="412" y="200" text-anchor="middle" font-size="11" fill="#A32D2D">DB 커넥션 풀</text>
<text x="412" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#A32D2D">20 — 여기서 막힘</text>

<text x="500" y="208" font-size="11" fill="#A32D2D">5,000개가 한꺼번에 도착</text>

<text x="360" y="286" text-anchor="middle" font-size="12" fill="#52514E">스레드 제한은 병목이면서 동시에 하위 시스템을 지켜주던 안전장치였다</text>
<text x="360" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#52514E">그 장치를 걷어냈다면, 제한은 다른 방법으로 다시 걸어야 한다</text>
</svg>
