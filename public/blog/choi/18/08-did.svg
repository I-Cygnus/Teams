<svg width="100%" viewBox="0 0 720 320" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif">
<title>이중차분법(DID)</title>
<desc>정책을 시행한 서울은 30 올랐고 시행하지 않은 부산은 10 올랐다면, 시장 전체 변화 10을 뺀 20이 정책 효과로 추정된다.</desc>
<line x1="100" y1="48" x2="100" y2="232" stroke="#898781" stroke-width="1"/>
<line x1="100" y1="232" x2="600" y2="232" stroke="#898781" stroke-width="1"/>
<text x="180" y="254" text-anchor="middle" font-size="11" fill="#52514E">시행 전</text>
<text x="520" y="254" text-anchor="middle" font-size="11" fill="#52514E">시행 후</text>
<line x1="180" y1="176" x2="520" y2="74" stroke="#0F6E56" stroke-width="2"/>
<circle cx="180" cy="176" r="5" fill="#0F6E56"/>
<circle cx="520" cy="74" r="5" fill="#0F6E56"/>
<text x="164" y="172" text-anchor="end" font-size="11" fill="#0F6E56">서울 100</text>
<text x="536" y="70" font-size="11" font-weight="600" fill="#0F6E56">130 (+30)</text>
<line x1="180" y1="176" x2="520" y2="142" stroke="#898781" stroke-width="2"/>
<circle cx="180" cy="176" r="5" fill="#898781"/>
<circle cx="520" cy="142" r="5" fill="#898781"/>
<text x="536" y="146" font-size="11" fill="#52514E">부산 110 (+10)</text>
<line x1="520" y1="74" x2="520" y2="142" stroke="#6C4EC9" stroke-width="2.5"/>
<text x="520" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#5B3FB5" transform="rotate(-90 520 112)">+20</text>
<text x="130" y="200" font-size="10.5" fill="#898781">정책 시행: 서울만</text>
<rect x="100" y="272" width="500" height="34" rx="8" fill="#EFE9FB" stroke="#6C4EC9" stroke-width="0.5"/>
<text x="350" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#5B3FB5">서울 변화(+30) − 부산 변화(+10) = 정책 효과 +20</text>
</svg>
