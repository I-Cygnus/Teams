<svg width="100%" viewBox="0 0 720 340" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif">
<title>A/B 테스트의 기본 구조</title>
<desc>사용자 1만 명을 랜덤하게 절반씩 나눠 A안과 B안을 보여주고, 각 그룹의 구매율을 비교한다.</desc>
<rect x="290" y="24" width="140" height="44" rx="8" fill="#F4F3F0" stroke="#898781" stroke-width="0.5"/>
<text x="360" y="42" text-anchor="middle" font-size="11" fill="#52514E">사용자</text>
<text x="360" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#12161F">10,000명</text>
<path d="M360 68 L360 96" stroke="#898781" stroke-width="1"/>
<path d="M360 96 l-4.5 -8 l9 0 z" fill="#898781"/>
<text x="376" y="88" font-size="10.5" fill="#898781">랜덤 배정</text>
<path d="M360 100 L190 100 L190 128" fill="none" stroke="#898781" stroke-width="1"/>
<path d="M190 128 l-4.5 -8 l9 0 z" fill="#898781"/>
<path d="M360 100 L530 100 L530 128" fill="none" stroke="#898781" stroke-width="1"/>
<path d="M530 128 l-4.5 -8 l9 0 z" fill="#898781"/>
<rect x="80" y="132" width="220" height="164" rx="10" fill="#F4F3F0" stroke="#898781" stroke-width="0.5"/>
<text x="190" y="158" text-anchor="middle" font-size="12.5" font-weight="600" fill="#52514E">A 그룹 · 5,000명</text>
<rect x="130" y="172" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#898781" stroke-width="0.5"/>
<text x="190" y="194" text-anchor="middle" font-size="12" fill="#12161F">구매하기</text>
<text x="190" y="234" text-anchor="middle" font-size="11" fill="#52514E">구매 500명</text>
<text x="190" y="266" text-anchor="middle" font-size="20" font-weight="600" fill="#52514E">10.0%</text>
<rect x="420" y="132" width="220" height="164" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="530" y="158" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F6E56">B 그룹 · 5,000명</text>
<rect x="470" y="172" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="530" y="194" text-anchor="middle" font-size="12" fill="#0F6E56">지금 구매하기</text>
<text x="530" y="234" text-anchor="middle" font-size="11" fill="#52514E">구매 600명</text>
<text x="530" y="266" text-anchor="middle" font-size="20" font-weight="600" fill="#0F6E56">12.0%</text>
<text x="360" y="322" text-anchor="middle" font-size="11.5" fill="#52514E">감으로 정하지 않고, 실제 사용자에게 물어본다</text>
</svg>
