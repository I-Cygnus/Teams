<svg width="100%" viewBox="0 0 720 268" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif">
<title>평균 하나로는 설명되지 않는다</title>
<desc>전체 평균은 플러스 5퍼센트지만 쪼개 보면 안드로이드는 플러스 10퍼센트, iOS는 마이너스 3퍼센트, 신규 사용자는 플러스 12퍼센트, 기존 사용자는 마이너스 2퍼센트일 수 있다.</desc>
<rect x="240" y="24" width="240" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="360" y="47" text-anchor="middle" font-size="11" fill="#52514E">전체 평균</text>
<text x="360" y="69" text-anchor="middle" font-size="18" font-weight="600" fill="#0F6E56">+5%</text>
<text x="500" y="58" font-size="11" fill="#898781">"B 좋네, 적용하자"</text>
<path d="M360 80 L360 104" stroke="#898781" stroke-width="1"/>
<path d="M360 104 l-4.5 -8 l9 0 z" fill="#898781"/>
<text x="376" y="98" font-size="10.5" fill="#898781">쪼개 보면</text>
<rect x="50" y="112" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="125" y="134" text-anchor="middle" font-size="11" fill="#52514E">Android</text>
<text x="125" y="157" text-anchor="middle" font-size="16" font-weight="600" fill="#0F6E56">+10%</text>
<rect x="216" y="112" width="150" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="291" y="134" text-anchor="middle" font-size="11" fill="#52514E">iOS</text>
<text x="291" y="157" text-anchor="middle" font-size="16" font-weight="600" fill="#A32D2D">−3%</text>
<rect x="382" y="112" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="457" y="134" text-anchor="middle" font-size="11" fill="#52514E">신규 사용자</text>
<text x="457" y="157" text-anchor="middle" font-size="16" font-weight="600" fill="#0F6E56">+12%</text>
<rect x="548" y="112" width="150" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="623" y="134" text-anchor="middle" font-size="11" fill="#52514E">기존 사용자</text>
<text x="623" y="157" text-anchor="middle" font-size="16" font-weight="600" fill="#A32D2D">−2%</text>
<text x="360" y="212" text-anchor="middle" font-size="12" fill="#52514E">"+5%"는 맞지만, 그 안에는 손해 보는 사용자도 섞여 있다</text>
<text x="360" y="240" text-anchor="middle" font-size="11.5" font-weight="600" fill="#A32D2D">평균은 "얼마나"는 알려주지만 "왜"와 "누구에게"는 말해주지 않는다</text>
</svg>
