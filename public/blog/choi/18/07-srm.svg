<svg width="100%" viewBox="0 0 720 236" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif">
<title>표본 비율 불일치(SRM)</title>
<desc>50대 50으로 설계했는데 실제 데이터가 80대 20이면 우연이 아니라 시스템 문제를 의심해야 한다.</desc>
<text x="60" y="56" font-size="12" font-weight="600" fill="#52514E">설계한 비율</text>
<rect x="200" y="40" width="230" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="315" y="58" text-anchor="middle" font-size="11" fill="#0F6E56">A 50%</text>
<rect x="430" y="40" width="230" height="26" rx="4" fill="#EFE9FB" stroke="#6C4EC9" stroke-width="0.5"/>
<text x="545" y="58" text-anchor="middle" font-size="11" fill="#5B3FB5">B 50%</text>
<text x="60" y="122" font-size="12" font-weight="600" fill="#A32D2D">실제 데이터</text>
<rect x="200" y="106" width="368" height="26" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="384" y="124" text-anchor="middle" font-size="11" fill="#A32D2D">A 80%</text>
<rect x="568" y="106" width="92" height="26" rx="4" fill="#EFE9FB" stroke="#6C4EC9" stroke-width="0.5"/>
<text x="614" y="124" text-anchor="middle" font-size="11" fill="#5B3FB5">B 20%</text>
<rect x="60" y="160" width="600" height="52" rx="8" fill="#FFFFFF" stroke="#A32D2D" stroke-width="1"/>
<text x="80" y="182" font-size="11.5" font-weight="600" fill="#A32D2D">"사용자가 우연히 그렇게 들어왔나?" — 아닙니다.</text>
<text x="80" y="202" font-size="11" fill="#52514E">랜덤 로직 버그 · 캐시 · 라우팅 · 특정 기기 누락 · 로그 유실을 먼저 의심하세요.</text>
</svg>
