<svg width="100%" viewBox="0 0 720 292" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif">
<title>중간에 계속 들여다보다 종료하는 문제</title>
<desc>표본이 쌓이는 동안 p값은 위아래로 흔들리는데, 우연히 0.05 아래로 내려간 순간에 실험을 멈추면 잘못된 결론을 얻는다.</desc>
<line x1="70" y1="60" x2="70" y2="220" stroke="#898781" stroke-width="1"/>
<line x1="70" y1="220" x2="660" y2="220" stroke="#898781" stroke-width="1"/>
<text x="52" y="66" text-anchor="end" font-size="10.5" fill="#898781">p</text>
<text x="660" y="242" text-anchor="end" font-size="10.5" fill="#898781">쌓인 사용자 수 →</text>
<line x1="70" y1="176" x2="660" y2="176" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="676" y="180" text-anchor="end" font-size="10.5" fill="#A32D2D">0.05</text>
<polyline points="70,96 130,120 190,104 250,150 310,168 370,140 430,190 490,158 550,132 610,146 660,138" fill="none" stroke="#6C4EC9" stroke-width="1.8"/>
<circle cx="430" cy="190" r="6" fill="#A32D2D"/>
<text x="430" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#A32D2D">"됐다!" 여기서 종료</text>
<text x="446" y="184" font-size="10.5" fill="#A32D2D">우연히 내려간 순간</text>
<circle cx="660" cy="138" r="5" fill="#6C4EC9"/>
<text x="656" y="120" text-anchor="end" font-size="10.5" fill="#6C4EC9">끝까지 갔다면 유의하지 않았다</text>
<text x="360" y="274" text-anchor="middle" font-size="11.5" fill="#52514E">계속 훔쳐보면서 "유의해지는 순간" 멈추면, 우연을 발견으로 착각하게 된다</text>
</svg>
