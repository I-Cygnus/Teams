<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif">
  <rect width="680" height="260" fill="#FDFAF7"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#1C1917">OOM 순간의 힙 — 누가 범인인가</text>
  <!-- heap bar -->
  <rect x="24" y="56" width="420" height="44" rx="6" fill="#FEE2D5" stroke="#DC6B4A" stroke-width="1.5"/>
  <rect x="24" y="56" width="392" height="44" rx="6" fill="#DC6B4A" opacity="0.85"/>
  <text x="40" y="83" font-size="13" font-weight="700" fill="#fff">결과 버퍼 (무제한 적재) — 힙 점유의 실체</text>
  <text x="452" y="83" font-size="12" fill="#9A3412">힙 98%</text>
  <!-- threads -->
  <g font-size="12.5">
    <rect x="24" y="126" width="200" height="34" rx="6" fill="#fff" stroke="#D6D3D1"/>
    <text x="38" y="148" fill="#44403C">Producer (문자열 연결)</text>
    <rect x="240" y="126" width="200" height="34" rx="6" fill="#fff" stroke="#D6D3D1"/>
    <text x="254" y="148" fill="#44403C">RMI idle 스레드 (유휴)</text>
    <rect x="456" y="126" width="200" height="34" rx="6" fill="#fff" stroke="#D6D3D1"/>
    <text x="470" y="148" fill="#44403C">HttpClient 셀렉터</text>
  </g>
  <g font-size="11.5" fill="#B91C1C" font-weight="700">
    <text x="38" y="182">✕ OOM — "마지막 요청자"</text>
    <text x="254" y="182">✕ OOM — 메모리 거의 안 씀</text>
    <text x="470" y="182">✕ OOM — 메모리 거의 안 씀</text>
  </g>
  <rect x="24" y="204" width="632" height="38" rx="6" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="40" y="228" font-size="13" fill="#7C2D12"><tspan font-weight="700">유휴 스레드까지 동시 OOM = 힙 전체 고갈.</tspan> 스택 맨 위(Producer)는 피해자, 범인은 버퍼.</text>
</svg>
