<svg width="100%" viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif">
  <rect width="680" height="250" fill="#F8FAFD"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0F172A">총량 거버넌스 3계층 — 최악의 경우에도 ≤ 72</text>
  <g text-anchor="middle" font-size="12.5">
    <rect x="30" y="60" width="180" height="66" rx="8" fill="#fff" stroke="#2E62F0" stroke-width="1.5"/>
    <text x="120" y="86" font-weight="700" fill="#1E3A8A">① 작업당 병렬수 상한</text>
    <text x="120" y="106" fill="#475569">N을 clamp — 입력에 통제</text>
    <text x="228" y="98" font-size="16" fill="#94A3B8">→</text>
    <rect x="246" y="60" width="180" height="66" rx="8" fill="#fff" stroke="#2E62F0" stroke-width="1.5"/>
    <text x="336" y="86" font-weight="700" fill="#1E3A8A">② 동시 작업 수 상한</text>
    <text x="336" y="106" fill="#475569">M을 큐잉으로 제한</text>
    <text x="444" y="98" font-size="16" fill="#94A3B8">→</text>
    <rect x="462" y="60" width="188" height="66" rx="8" fill="#fff" stroke="#2E62F0" stroke-width="1.5"/>
    <text x="556" y="86" font-weight="700" fill="#1E3A8A">③ DB CONNECTION LIMIT</text>
    <text x="556" y="106" fill="#475569">계정 레벨 최후 방어선</text>
  </g>
  <rect x="200" y="156" width="280" height="44" rx="8" fill="#1E3A8A"/>
  <text x="340" y="184" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">(2N+2) × M ≤ 72 (상수)</text>
  <text x="24" y="232" font-size="12" fill="#64748B">각 층이 독립적으로 성립 — 한 층이 뚫려도 다음 층이 막는다. 통제는 풀이 아니라 입력에.</text>
</svg>
