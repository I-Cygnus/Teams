<svg width="100%" viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif">
  <rect width="680" height="250" fill="#F8FAFD"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0F172A">작업 1개의 커넥션 — 수요 2N+2 vs 공급 N</text>
  <text x="24" y="66" font-size="13" font-weight="700" fill="#1E3A8A">수요 (스레드 모델)</text>
  <g font-size="12.5">
    <rect x="24" y="78" width="180" height="34" rx="6" fill="#DBEAFE" stroke="#2E62F0"/><text x="38" y="100" fill="#1E3A8A">분석 스레드 × N</text>
    <rect x="214" y="78" width="180" height="34" rx="6" fill="#DBEAFE" stroke="#2E62F0"/><text x="228" y="100" fill="#1E3A8A">결과 기록 × N</text>
    <rect x="404" y="78" width="150" height="34" rx="6" fill="#DBEAFE" stroke="#2E62F0"/><text x="418" y="100" fill="#1E3A8A">관리+보고 = 2</text>
    <rect x="566" y="78" width="90" height="34" rx="6" fill="#1E3A8A"/><text x="583" y="100" fill="#fff" font-weight="700">= 2N+2</text>
  </g>
  <text x="24" y="150" font-size="13" font-weight="700" fill="#9A3412">공급 (풀 설정)</text>
  <rect x="24" y="162" width="300" height="34" rx="6" fill="#FEF3C7" stroke="#D97706"/>
  <text x="38" y="184" font-size="12.5" fill="#92400E">maximumPoolSize = N  (병렬도만큼만)</text>
  <text x="344" y="184" font-size="13" font-weight="800" fill="#B91C1C">→ 공급이 항상 수요의 절반 이하</text>
  <rect x="24" y="212" width="632" height="26" rx="5" fill="#EEF2FF"/>
  <text x="38" y="230" font-size="12.5" fill="#3730A3">풀을 늘려도, 병렬도를 낮춰도 비율은 그대로 — 크기가 아니라 <tspan font-weight="700">구조</tspan>의 문제</text>
</svg>
