<svg width="100%" viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif">
  <rect width="680" height="250" fill="#FAF8FE"/>
  <text x="24" y="32" font-size="15" font-weight="700" fill="#2E1065">인증 파이프라인 — 요청은 세 종류다</text>
  <rect x="24" y="52" width="130" height="40" rx="7" fill="#fff" stroke="#C4B5FD"/>
  <text x="52" y="77" font-size="13" fill="#4C1D95">모든 요청</text>
  <text x="166" y="77" font-size="15" fill="#A78BFA">→</text>
  <rect x="188" y="46" width="180" height="150" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="200" y="68" font-size="12.5" font-weight="700" fill="#5B21B6">AuthenticationInterceptor</text>
  <g font-size="11.5" fill="#4C1D95">
    <text x="200" y="94">① @PublicEndpoint → 통과</text>
    <text x="200" y="122">② X-Internal-Key → 통과</text>
    <text x="200" y="150">③ 토큰 → Redis 검증</text>
    <text x="212" y="168" fill="#B91C1C">실패 시 401</text>
  </g>
  <text x="380" y="122" font-size="15" fill="#A78BFA">→</text>
  <rect x="402" y="76" width="120" height="88" rx="8" fill="#fff" stroke="#C4B5FD"/>
  <text x="414" y="100" font-size="12" font-weight="700" fill="#5B21B6">ArgumentResolver</text>
  <text x="414" y="120" font-size="11.5" fill="#4C1D95">검증된 accountId를</text>
  <text x="414" y="136" font-size="11.5" fill="#4C1D95">파라미터로 주입</text>
  <text x="534" y="122" font-size="15" fill="#A78BFA">→</text>
  <rect x="552" y="76" width="106" height="88" rx="8" fill="#EDE9FE"/>
  <text x="564" y="102" font-size="12" font-weight="700" fill="#5B21B6">Controller</text>
  <text x="564" y="122" font-size="11" fill="#4C1D95">@LoginUser</text>
  <text x="564" y="137" font-size="11" fill="#4C1D95">Long accountId</text>
  <rect x="24" y="212" width="632" height="26" rx="5" fill="#EDE9FE"/>
  <text x="38" y="230" font-size="12.5" fill="#4C1D95">컨트롤러 71곳의 인증 코드 → 0곳. 정책(공개/내부/사용자)은 코드에 명시된다.</text>
</svg>
