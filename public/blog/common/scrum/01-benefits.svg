<svg width="100%" viewBox="0 0 720 412" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:'Wanted Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif">
<title>매일 스크럼이 우리에게 준 여섯 가지</title>
<desc>작업 관리, 소통의 밀도, 이슈 대응, 방향성 정렬, 각성, 컨텍스트 지속 — 매일 스크럼의 여섯 가지 효과.</desc>
<rect x="0.5" y="0.5" width="719" height="411" rx="16" fill="#FAFBFC" stroke="#E8EAED"/>
<text x="28" y="42" font-size="13.5" font-weight="700" fill="#12161F">매일 스크럼이 우리에게 준 것</text>

<rect x="28" y="64" width="320" height="96" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="48" y="96" font-size="13" font-weight="700" fill="#12161F">작업 관리</text>
<text x="48" y="120" font-size="11" fill="#5B6474">오늘 얼마나 할지 스스로 말하고,</text>
<text x="48" y="137" font-size="11" fill="#5B6474">팀과 소통하며 분량을 조율한다</text>

<rect x="372" y="64" width="320" height="96" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="392" y="96" font-size="13" font-weight="700" fill="#12161F">소통의 밀도</text>
<text x="392" y="120" font-size="11" fill="#5B6474">각자의 작업 컨텍스트와 진행 방향을</text>
<text x="392" y="137" font-size="11" fill="#5B6474">매일 공유하고 조율한다</text>

<rect x="28" y="172" width="320" height="96" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="48" y="204" font-size="13" font-weight="700" fill="#12161F">이슈 대응</text>
<text x="48" y="228" font-size="11" fill="#5B6474">A 작업이 멈춰 B가 막히는 상황이</text>
<text x="48" y="245" font-size="11" fill="#5B6474">커지기 전에 그날 해소된다</text>

<rect x="372" y="172" width="320" height="96" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="392" y="204" font-size="13" font-weight="700" fill="#12161F">방향성 정렬</text>
<text x="392" y="228" font-size="11" fill="#5B6474">매일 맞추기 때문에 방향의 괴리가</text>
<text x="392" y="245" font-size="11" fill="#5B6474">커질 틈이 없다</text>

<rect x="28" y="280" width="320" height="96" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="48" y="312" font-size="13" font-weight="700" fill="#12161F">각성</text>
<text x="48" y="336" font-size="11" fill="#5B6474">진행되고 있다는 성취감과</text>
<text x="48" y="353" font-size="11" fill="#5B6474">적당한 의무감이 리듬을 만든다</text>

<rect x="372" y="280" width="320" height="96" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="392" y="312" font-size="13" font-weight="700" fill="#12161F">컨텍스트 지속</text>
<text x="392" y="336" font-size="11" fill="#5B6474">논의거리와 아이디어가 잊히기 전에</text>
<text x="392" y="353" font-size="11" fill="#5B6474">공유되고 기록된다</text>
</svg>
