<svg width="100%" viewBox="0 0 720 316" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:'Wanted Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif">
<title>우리의 앞으로의 협업 리듬</title>
<desc>백로그 보드는 상시로 열려 있고, 매일 가벼운 체크인을 남기며, 금요일에는 주간 스크럼을 진행한다.</desc>
<rect x="0.5" y="0.5" width="719" height="315" rx="16" fill="#FAFBFC" stroke="#E8EAED"/>

<rect x="48" y="40" width="624" height="52" rx="12" fill="#12161F"/>
<text x="72" y="71" font-size="12.5" font-weight="700" fill="#FFFFFF">상시 — 백로그 보드</text>
<text x="648" y="71" text-anchor="end" font-size="11" fill="#ABB0B8">등록 · 의견 · 알림으로 이어지는 소통</text>

<rect x="48" y="116" width="112" height="108" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="104" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#5B6474">월</text>
<circle cx="104" cy="168" r="4" fill="#2E62F0"/>
<text x="104" y="196" text-anchor="middle" font-size="10.5" fill="#3C4453">체크인</text>

<rect x="176" y="116" width="112" height="108" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="232" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#5B6474">화</text>
<circle cx="232" cy="168" r="4" fill="#2E62F0"/>
<text x="232" y="196" text-anchor="middle" font-size="10.5" fill="#3C4453">체크인</text>

<rect x="304" y="116" width="112" height="108" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="360" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#5B6474">수</text>
<circle cx="360" cy="168" r="4" fill="#2E62F0"/>
<text x="360" y="196" text-anchor="middle" font-size="10.5" fill="#3C4453">체크인</text>

<rect x="432" y="116" width="112" height="108" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="488" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#5B6474">목</text>
<circle cx="488" cy="168" r="4" fill="#2E62F0"/>
<text x="488" y="196" text-anchor="middle" font-size="10.5" fill="#3C4453">체크인</text>

<rect x="560" y="116" width="112" height="108" rx="12" fill="#F0F5FF" stroke="#2E62F0"/>
<text x="616" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#1F47B8">금</text>
<circle cx="616" cy="164" r="4" fill="#2E62F0"/>
<text x="616" y="188" text-anchor="middle" font-size="10.5" fill="#3C4453">체크인</text>
<text x="616" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#1F47B8">+ 주간 스크럼</text>

<text x="360" y="268" text-anchor="middle" font-size="12" fill="#5B6474">매일은 글로, 매주는 얼굴 보고 — 회의는 줄지만 소통은 끊기지 않는다</text>
</svg>
