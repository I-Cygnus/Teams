<svg width="100%" viewBox="0 0 720 512" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:'Wanted Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif">
<title>네 가지 장치가 매일 스크럼의 장점을 나눠 담는다</title>
<desc>백로그 보드, 비동기 데일리 체크인, 주간 스크럼, 자체 협업툴 네 가지 장치가 각각 매일 스크럼의 장점들을 나눠 담는 구조.</desc>
<rect x="0.5" y="0.5" width="719" height="511" rx="16" fill="#FAFBFC" stroke="#E8EAED"/>
<text x="28" y="42" font-size="13.5" font-weight="700" fill="#12161F">네 가지 장치 — 장점을 나눠 담는다</text>

<rect x="28" y="64" width="664" height="96" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="52" y="98" font-size="13" font-weight="700" fill="#12161F">백로그 보드 <tspan font-weight="400" fill="#ABB0B8">— 상시</tspan></text>
<text x="52" y="124" font-size="11" fill="#5B6474">작업 단위 = 백로그. 새 글과 의견이 알림으로 이어져 그 자리에서 소통한다</text>
<rect x="440" y="126" width="56" height="22" rx="11" fill="#F0F5FF"/>
<text x="468" y="141" text-anchor="middle" font-size="10.5" fill="#1F47B8">방향성</text>
<rect x="504" y="126" width="64" height="22" rx="11" fill="#F0F5FF"/>
<text x="536" y="141" text-anchor="middle" font-size="10.5" fill="#1F47B8">이슈 대응</text>
<rect x="576" y="126" width="96" height="22" rx="11" fill="#F0F5FF"/>
<text x="624" y="141" text-anchor="middle" font-size="10.5" fill="#1F47B8">컨텍스트 지속</text>

<rect x="28" y="174" width="664" height="96" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="52" y="208" font-size="13" font-weight="700" fill="#12161F">비동기 데일리 체크인 <tspan font-weight="400" fill="#ABB0B8">— 매일</tspan></text>
<text x="52" y="234" font-size="11" fill="#5B6474">매일의 리듬을 남기는 가벼운 기록 — 형태는 운영하며 다듬는 중</text>
<rect x="492" y="236" width="64" height="22" rx="11" fill="#F0F5FF"/>
<text x="524" y="251" text-anchor="middle" font-size="10.5" fill="#1F47B8">작업 관리</text>
<rect x="564" y="236" width="44" height="22" rx="11" fill="#F0F5FF"/>
<text x="586" y="251" text-anchor="middle" font-size="10.5" fill="#1F47B8">각성</text>
<rect x="616" y="236" width="56" height="22" rx="11" fill="#F0F5FF"/>
<text x="644" y="251" text-anchor="middle" font-size="10.5" fill="#1F47B8">가시성</text>

<rect x="28" y="284" width="664" height="96" rx="12" fill="#FFFFFF" stroke="#E8EAED"/>
<text x="52" y="318" font-size="13" font-weight="700" fill="#12161F">주간 스크럼 <tspan font-weight="400" fill="#ABB0B8">— 주 1회</tspan></text>
<text x="52" y="344" font-size="11" fill="#5B6474">한 주의 백로그와 의견들을 논의하고 마무리한다. 글로 풀린 것은 안건에서 뺀다</text>
<rect x="468" y="346" width="72" height="22" rx="11" fill="#F0F5FF"/>
<text x="504" y="361" text-anchor="middle" font-size="10.5" fill="#1F47B8">깊은 소통</text>
<rect x="548" y="346" width="76" height="22" rx="11" fill="#F0F5FF"/>
<text x="586" y="361" text-anchor="middle" font-size="10.5" fill="#1F47B8">팀의 온도</text>

<rect x="28" y="394" width="664" height="96" rx="12" fill="#FFFFFF" stroke="#2E62F0" stroke-width="1"/>
<text x="52" y="428" font-size="13" font-weight="700" fill="#12161F">자체 협업툴 <tspan font-weight="400" fill="#ABB0B8">— 기반</tspan></text>
<text x="52" y="454" font-size="11" fill="#5B6474">위의 전부가 우리가 만든 툴 위에서 돈다. 우리가 만들었으니, 쓰면서 계속 고친다</text>
<rect x="500" y="456" width="124" height="22" rx="11" fill="#2E62F0"/>
<text x="562" y="471" text-anchor="middle" font-size="10.5" fill="#FFFFFF">세 장치의 기반</text>
</svg>
